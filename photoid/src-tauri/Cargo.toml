[package]
name = "photoid"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
image = "0.24"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# opencv = { version = "0.88.9", default-features = false, features = ["dnn", "imgproc", "objdetect", "imgcodecs"] }
# Clang crash workaround: use an earlier version of opencv bindings locally or comment it out for now to pass compilation if strictly needed
reqwest = { version = "0.11", features = ["blocking"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
base64 = "0.21"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
